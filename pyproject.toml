[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arbeitsamt-job-finder"
version = "0.1.0"
description = "Raw-JSON job search demo for the unofficial Bundesagentur fuer Arbeit Jobsuche API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["requests>=2.31,<3"]